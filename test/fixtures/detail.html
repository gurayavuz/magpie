<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fine detail</title>
    <style>
      * { margin: 0; padding: 0; }
      /* A tight checkerboard: high pixel variance everywhere, so mosaicing a
         region is measurable rather than a judgement call. */
      body {
        height: 2000px;
        background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0 / 6px 6px;
      }
    </style>
  </head>
  <body></body>
</html>
